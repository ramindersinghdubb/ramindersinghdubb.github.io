{% if site.social_github %}<div class="social-div"><span>GitHub: <a href="https://github.com/{{ site.social_github | escape }}">{{site.social_github | escape}}</a></span></div>{% endif %}
{% if site.social_linkedin %}<div class="social-div"><span>LinkedIn: <a href="https://www.linkedin.com/in/{{ site.social_linkedin | escape }}">{{ site.social_linkedin | escape }}</a></span></div>{% endif %}
